<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب جمعية الناصر</title>
<meta name="theme-color" content="#1f2530">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حساب الناصر">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img class="logo" src="icons/logo.png" alt="" onerror="this.style.display='none'">
    <div>
      <div class="brand-name" id="entity">جمعية الناصر</div>
      <div class="brand-sub">سجل الحساب المالي</div>
    </div>
  </div>
  <div class="top-end">
    <span class="chip" id="roleChip" hidden></span>
    <button class="icon-btn" id="syncBtn" data-act="refresh" aria-label="تحديث">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>
<div class="syncline" id="syncline"></div>

<main id="view"></main>

<button class="fab" id="fab" data-act="add" hidden aria-label="إضافة حركة">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>الرئيسية</span></button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span>الحركات</span></button>
  <button data-tab="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>التقارير</span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>الإعدادات</span></button>
</nav>

<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
